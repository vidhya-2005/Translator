<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Universal Translator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<main class="container">
    <header>
        <h1>Universal Translator</h1>
        <p>Translate text, speech, images, documents and YouTube videos with AI.</p>
    </header>

    <section class="grid">
        <div class="card">
            <h2>Input</h2>
            <textarea id="text-input" rows="5" placeholder="Enter text to translate..."></textarea>

            <label for="file-upload">Upload file</label>
            <input id="file-upload" type="file"
                   accept=".png,.jpg,.jpeg,.pdf,.docx,audio/*,video/*">
            <small>Supported: PNG, JPG, PDF, DOCX, audio and video</small>

            <input id="youtube-link" type="url" placeholder="Paste YouTube link...">

            <div class="actions">
                <button id="translate-btn">Translate</button>
                <button id="record-btn">🎙 Record</button>
            </div>
            <p id="recording-status"></p>
        </div>

        <div class="card">
            <h2>Output</h2>
            <div class="language-grid">
                <label>From
                    <select id="source-lang">
                        <option value="auto">Auto-Detect</option>
                        {% for code, name in languages.items() %}
                        <option value="{{ code }}">{{ name|capitalize }}</option>
                        {% endfor %}
                    </select>
                </label>
                <label>To
                    <select id="target-lang">
                        {% for code, name in languages.items() %}
                        <option value="{{ code }}" {% if code == "en" %}selected{% endif %}>{{ name|capitalize }}</option>
                        {% endfor %}
                    </select>
                </label>
            </div>
            <p id="detected-language" class="detected-language">Detected language: —</p>
            <label>Transcription / Extracted Text
                <textarea id="transcription" rows="4" readonly></textarea>
            </label>
            <label>Translation
                <textarea id="translation" rows="4" readonly></textarea>
            </label>
            <div class="actions">
                <button id="copy-btn">Copy</button>
                <button id="play-btn" disabled>▶ Play</button>
            </div>
        </div>
    </section>
    <p id="error-message" class="error"></p>
    <div id="loader" class="loader hidden">Processing...</div>
</main>
<script>
    const LANGUAGES = {{ languages|tojson }};
</script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
